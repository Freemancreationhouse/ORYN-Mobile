plugins {
    id 'com.android.application'
}

android {
    namespace 'house.freeman.orynmobile'
    compileSdk 36

    defaultConfig {
        applicationId 'house.freeman.orynmobile'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.2.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
