plugins { id 'com.android.application' }

android {
    namespace 'house.freeman.orynmobile'
    compileSdk 35

    defaultConfig {
        applicationId 'house.freeman.orynmobile'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
