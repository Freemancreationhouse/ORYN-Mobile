name: Build ORYN Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify Android project root
        run: |
          pwd
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          echo "ORYN Mobile Android project found at repository root."

      - name: Build release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare APK artifact
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/ORYN-Mobile-Standalone-v1.apk

      - name: Upload ORYN Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: ORYN-Mobile-Standalone-v1-APK
          path: app/build/outputs/apk/release/ORYN-Mobile-Standalone-v1.apk
          if-no-files-found: error
          retention-days: 30
