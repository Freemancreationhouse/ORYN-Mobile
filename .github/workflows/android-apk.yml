name: Build ORYN Mobile APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ORYN-Mobile-Standalone-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ORYN-Mobile-Standalone-v1-APK
          path: mobile/app/build/outputs/apk/release/ORYN-Mobile-Standalone-v1.apk
