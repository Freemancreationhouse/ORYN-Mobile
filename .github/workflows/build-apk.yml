name: Build ORYN Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preflight source check
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/studiokinematics/oryn/MainActivity.java
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle
          ! grep -R "setTextAllCaps" app/src/main/java

      - name: Build debug APK
        run: gradle clean :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ORYN-Mobile-v1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORYN-Mobile-v1.0-debug
          path: ORYN-Mobile-v1.0-debug.apk
          if-no-files-found: error
