name: Build ORYN Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate ORYN connection and coupled motion
        run: |
          node tests/test_connection_state.js
          node tests/test_direct_coupled_motion.js
          node tests/test_direct_playback_state.js
          node tests/test_background_playlist.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ORYN-V10.4.1-direct-background-playlist-fix-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORYN-V10.4.1-Direct-Background-Playlist-Fix-APK
          path: ORYN-V10.4.1-direct-background-playlist-fix-debug.apk
          if-no-files-found: error
