name: Build ORYN Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate ORYN Direct measured motion streamer
        run: |
          node tests/test_connection_state.js
          node tests/test_direct_coupled_motion.js
          node tests/test_direct_ack_framing.js
          node tests/test_direct_clear_progression.js
          node tests/test_direct_streamer_static.js
          node tests/test_direct_clear_mode_bridge.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ORYN_ANDROID_V10_4_1_UNIFIED_FINAL_MEASURED_MOTION_STREAMING_CLEAR_FIX-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORYN-V10.4.1-Measured-Motion-Streaming-Clear-Fix-APK
          path: ORYN_ANDROID_V10_4_1_UNIFIED_FINAL_MEASURED_MOTION_STREAMING_CLEAR_FIX-debug.apk
          if-no-files-found: error
